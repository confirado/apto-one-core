<h5>Editor</h5>
<div layout="row" layout-align="start" flex>
    <div style="border:1px solid black;width:100%;height:600px;overflow:auto;">
        <canvas id="printableAreaEditor"></canvas>
    </div>
</div>
<div layout="row" layout-align="start" flex>
    <input id="background-image-file" type="file" accept="image/*" style="display:none" />
    <md-button
        class="md-raised md-primary md-cornered md-button md-ink-ripple"
        title="Open Background Image"
        ng-click="$ctrl.openEditorBackgroundImage()">
        Open Background Image
    </md-button>

    <md-select ng-model="$ctrl.editorPrintableAreaShape">
        <md-option ng-value="shape" ng-repeat="shape in $ctrl.editorPrintableAreaShapes">{{ shape }}</md-option>
    </md-select>
</div>
