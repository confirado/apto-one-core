<h5>Editor</h5>
<div layout="row" layout-align="start" flex>
    <div style="border:1px solid black;width:100%;height:600px;overflow:auto;">
        <canvas id="printableAreaEditor"></canvas>
    </div>
</div>

<div layout="row" layout-align="start" flex>
    <input id="background-image-file" type="file" accept="image/*" style="display:none" />

    <div flex="5"></div>
    <md-input-container>
        <md-button
            class="md-raised md-primary md-cornered md-button md-ink-ripple"
            title="Open Background Image"
            ng-click="$ctrl.openEditorBackgroundImage()">
            Open Background Image
        </md-button>
    </md-input-container>

    <div flex="5"></div>
    <md-input-container>
        <label>Shape:</label>
        <md-select ng-model="$ctrl.editorPrintableAreaShape" ng-change="$ctrl.onChangeShape()">
            <md-option ng-value="shape" ng-repeat="shape in $ctrl.editorPrintableAreaShapes">{{ shape }}</md-option>
        </md-select>
    </md-input-container>


    <ng-container ng-if="$ctrl.editorPrintableAreaShape === 'Circle'">
        <md-input-container flex>
            <label>Circle X (px):</label>
            <input type="number" step="1" ng-model="$ctrl.shapeObjectProperties.left" ng-change="$ctrl.updateShapeObject()">
        </md-input-container>

        <md-input-container flex>
            <label>Circle Y (px):</label>
            <input type="number" step="1" ng-model="$ctrl.shapeObjectProperties.top" ng-change="$ctrl.updateShapeObject()">
        </md-input-container>

        <md-input-container flex>
            <label>Circle Radius (px):</label>
            <input type="number" step="1" ng-model="$ctrl.shapeObjectProperties.radius" ng-change="$ctrl.updateShapeObject()">
        </md-input-container>
    </ng-container>
</div>
